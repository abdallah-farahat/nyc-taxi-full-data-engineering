<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="NYC Taxi Full Data Engineering (Data Pill)" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060f24"/>
      <stop offset="1" stop-color="#17408a"/>
    </linearGradient>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#0B1B3A"/>
      <rect width="16" height="16" fill="#FFC400"/>
      <rect x="16" y="16" width="16" height="16" fill="#FFC400"/>
    </pattern>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="1" stop-color="#fff6cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2a8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff2a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="1280" height="340" fill="url(#sky)"/>
  <circle cx="1130" cy="72" r="48" fill="url(#moon)"/>
  <circle cx="1130" cy="72" r="20" fill="#fff6cc"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="610" cy="42" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="88" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="36" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="52" r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="34" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="48" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="120" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- skyline -->
  <g fill="#091a3b">
    <rect x="690" y="176" width="60" height="112"/>
    <rect x="760" y="124" width="52" height="164"/>
    <polygon points="826,288 826,96 850,62 874,96 874,288"/>
    <rect x="849" y="30" width="3" height="34"/>
    <rect x="886" y="152" width="70" height="136"/>
    <rect x="966" y="104" width="56" height="184"/>
    <rect x="1032" y="164" width="80" height="124"/>
    <rect x="1122" y="132" width="62" height="156"/>
    <rect x="1194" y="184" width="86" height="104"/>
  </g>

  <!-- lit windows -->
  <g fill="#FFC400">
    <rect x="702" y="192" width="8" height="10" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="722" y="214" width="8" height="10" opacity="0.7"/>
    <rect x="702" y="240" width="8" height="10" opacity="0.8"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="774" y="146" width="8" height="10" opacity="0.8"/>
    <rect x="794" y="176" width="8" height="10" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="774" y="220" width="8" height="10" opacity="0.7"/>
    <rect x="794" y="252" width="8" height="10" opacity="0.8"/>
    <rect x="843" y="130" width="8" height="10" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="843" y="170" width="8" height="10" opacity="0.7"/>
    <rect x="843" y="214" width="8" height="10" opacity="0.8"/>
    <rect x="900" y="170" width="8" height="10" opacity="0.8"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.8s" repeatCount="indefinite"/></rect>
    <rect x="930" y="204" width="8" height="10" opacity="0.7"/>
    <rect x="900" y="244" width="8" height="10" opacity="0.9"/>
    <rect x="980" y="130" width="8" height="10" opacity="0.9"/>
    <rect x="1002" y="160" width="8" height="10" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.2s" repeatCount="indefinite"/></rect>
    <rect x="980" y="204" width="8" height="10" opacity="0.8"/>
    <rect x="1002" y="244" width="8" height="10" opacity="0.8"/>
    <rect x="1046" y="190" width="8" height="10" opacity="0.8"/>
    <rect x="1078" y="224" width="8" height="10" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="1138" y="156" width="8" height="10" opacity="0.8"/>
    <rect x="1162" y="196" width="8" height="10" opacity="0.7"/>
    <rect x="1138" y="246" width="8" height="10" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.8s" repeatCount="indefinite"/></rect>
    <rect x="1212" y="206" width="8" height="10" opacity="0.8"/>
    <rect x="1240" y="244" width="8" height="10" opacity="0.7"/>
  </g>

  <!-- road -->
  <rect y="286" width="1280" height="54" fill="#040b1a"/>
  <line x1="0" y1="318" x2="1280" y2="318" stroke="#FFC400" stroke-width="4" stroke-dasharray="36 28">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- checkered bands -->
  <rect width="1280" height="16" fill="url(#checker)"/>
  <rect y="324" width="1280" height="16" fill="url(#checker)"/>

  <!-- driving taxi -->
  <g transform="translate(-230,232)">
    <animateTransform attributeName="transform" type="translate" from="-230 232" to="1340 232" dur="14s" repeatCount="indefinite"/>
    <polygon points="170,44 340,22 340,76 170,60" fill="url(#beam)"/>
    <rect x="0" y="30" width="170" height="32" rx="9" fill="#FFC400"/>
    <path d="M34 30 L56 6 H116 L142 30 Z" fill="#FFC400"/>
    <path d="M44 30 L60 11 H82 V30 Z" fill="#a9d6ff"/>
    <path d="M88 30 V11 H112 L130 30 Z" fill="#a9d6ff"/>
    <rect x="72" y="-5" width="34" height="11" rx="2" fill="#ffffff"/>
    <text x="89" y="4" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#0B1B3A">TAXI</text>
    <rect x="0" y="46" width="170" height="6" fill="url(#checker)"/>
    <circle cx="163" cy="42" r="5" fill="#fff6b0"/>
    <circle cx="40" cy="62" r="12" fill="#0a0a0a"/>
    <circle cx="40" cy="62" r="5" fill="#9aa4b5"/>
    <circle cx="132" cy="62" r="12" fill="#0a0a0a"/>
    <circle cx="132" cy="62" r="5" fill="#9aa4b5"/>
  </g>

  <!-- title -->
  <text x="60" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#FFC400">NYC Taxi</text>
  <text x="62" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#ffffff">Full Data Engineering <tspan fill="#FFC400">(Data Pill)</tspan></text>
  <text x="62" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#bcd0f5">83.3M trips · Kafka · Spark · Delta · SQL Server · Airflow · dbt · Power BI</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
