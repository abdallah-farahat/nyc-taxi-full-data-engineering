<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="c" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#0B1B3A"/>
      <rect width="14" height="14" fill="#FFC400"/>
      <rect x="14" y="14" width="14" height="14" fill="#FFC400"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="14" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-28 0" dur="2s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="1300" height="14" fill="url(#c)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
