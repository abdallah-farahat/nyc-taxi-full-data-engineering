    <text x="701.5" y="70" font-size="38" font-weight="800" fill="#FFC400">40 / 40</text>
    <text x="701.5" y="98" font-size="15" font-weight="600" fill="#ffffff">Checks passed</text>
    <text x="701.5" y="120" font-size="12" fill="#9bb4e6">verify_all.py</text>

    <!-- card 5 -->
    <rect x="812" y="10" width="185" height="130" rx="14" fill="#0F2A55" stroke="#1d4a94"/>
    <rect x="812" y="10" width="185" height="6" rx="3" fill="#FFC400"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></rect>
    <text x="904.5" y="70" font-size="38" font-weight="800" fill="#FFC400">21</text>
    <text x="904.5" y="98" font-size="15" font-weight="600" fill="#ffffff">Unit tests</text>
    <text x="904.5" y="120" font-size="12" fill="#9bb4e6">pytest + GitHub Actions</text>

