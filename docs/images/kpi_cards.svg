    <text x="1107.5" y="70" font-size="38" font-weight="800" fill="#FFC400">12</text>
    <text x="1107.5" y="98" font-size="15" font-weight="600" fill="#ffffff">Airflow tasks</text>
    <text x="1107.5" y="120" font-size="12" fill="#9bb4e6">zero manual steps</text>
