    <text x="295.5" y="70" font-size="38" font-weight="800" fill="#FFC400">83.25M</text>
    <text x="295.5" y="98" font-size="15" font-weight="600" fill="#ffffff">Trips in Gold</text>
    <text x="295.5" y="120" font-size="12" fill="#9bb4e6">after 3 quality gates</text>

    <!-- card 3 -->
    <rect x="406" y="10" width="185" height="130" rx="14" fill="#0F2A55" stroke="#1d4a94"/>
