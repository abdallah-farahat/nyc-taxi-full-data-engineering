<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Key numbers of the project" xmlns:c2pa="http://c2pa.org/manifest">
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- card 1 -->
    <rect x="0" y="10" width="185" height="130" rx="14" fill="#0F2A55" stroke="#1d4a94"/>
    <rect x="0" y="10" width="185" height="6" rx="3" fill="#FFC400"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="92.5" y="70" font-size="38" font-weight="800" fill="#FFC400">83.3M</text>
    <text x="92.5" y="98" font-size="15" font-weight="600" fill="#ffffff">Trips ingested</text>
    <text x="92.5" y="120" font-size="12" fill="#9bb4e6">files + API + Kafka</text>

    <!-- card 2 -->
    <rect x="203" y="10" width="185" height="130" rx="14" fill="#0F2A55" stroke="#1d4a94"/>
