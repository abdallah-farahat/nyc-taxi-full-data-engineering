    <text x="498.5" y="70" font-size="38" font-weight="800" fill="#FFC400">0.036%</text>
    <text x="498.5" y="98" font-size="15" font-weight="600" fill="#ffffff">Quarantined</text>
    <text x="498.5" y="120" font-size="12" fill="#9bb4e6">30,232 rows, each explained</text>

    <!-- card 4 -->
    <rect x="609" y="10" width="185" height="130" rx="14" fill="#0F2A55" stroke="#1d4a94"/>
