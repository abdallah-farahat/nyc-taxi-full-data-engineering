name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Spark needs Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (same versions as the Docker image)
        run: pip install pyspark==3.5.3 delta-spark==3.2.1 pyyaml "pymssql>=2.3,<3" pytest

      - name: Run unit tests
        run: python -m pytest tests -v
        env:
          PYTHONPATH: src
          RAW_DATA_PATH: /tmp/raw
          LAKEHOUSE_PATH: /tmp/lakehouse