nyc_taxi:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('DBT_SQLSERVER_HOST', 'localhost') }}"
      port: 1433
      database: nyc_taxi_dw
      schema: dbo
      authentication: sql
      user: "{{ env_var('SQLSERVER_USER') }}"
      password: "{{ env_var('SQLSERVER_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 4